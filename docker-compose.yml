# W0RKFL0W5 stack: n8n (main + external task runners) on Postgres, plus the
# mock Okta/Slack/Jira service for local development and CI.
#
#   cp .env.example .env    # then edit secrets / point at real services
#   docker compose up -d --build --wait
#
# To use real Okta/Slack/Jira instead of the mocks, set the URLs and tokens
# in .env and remove `mocks` from COMPOSE_PROFILES. See docs/real-accounts.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.42.5
    restart: unless-stopped
    # Sync workflows + credentials from the repo, then start n8n.
    entrypoint: ["tini", "--", "node", "/opt/w0rkfl0w5/scripts/bootstrap.mjs"]
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: ${TZ:-America/Los_Angeles}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN in .env}
      WORKFLOWS_DIR: /workflows
      ACCESS_POLICY_FILE: /config/access-policy.json
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./config:/config:ro
      - ./scripts:/opt/w0rkfl0w5/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

  # Code nodes run here, isolated from the main n8n process.
  n8n-runners:
    image: n8nio/runners:2.42.5
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n

  mocks:
    build: ./mocks
    profiles: [mocks]
    restart: unless-stopped
    ports:
      - "4010:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  n8n_data:
